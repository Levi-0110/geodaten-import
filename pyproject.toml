[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoimport"
version = "0.2.0"
description = "Geodaten-Import-Pipeline: WFS- und CSV-Quellen nach PostgreSQL/PostGIS, Ersetzen je Quelle, Änderungsprotokoll je Lauf und Import-Bericht"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Levi Fox Griesinger" }]
keywords = ["wfs", "csv", "postgis", "geodaten", "import", "etl"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: GIS",
]
dependencies = [
    "httpx>=0.27,<1",
    "pydantic>=2.7,<3",
    "PyYAML>=6.0,<7",
    "psycopg[binary]>=3.2,<4",
    "shapely>=2.0,<3",
    "pyproj>=3.6,<4",
    "APScheduler>=3.10,<4",
    "defusedxml>=0.7,<1",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pip-licenses>=5",
    "ruff>=0.5",
]

[project.scripts]
geoimport = "geoimport.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
geoimport = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "e2e: End-to-End-Test gegen PostGIS und lokalen HTTP-Server",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
